syntax = "proto3";

package whoismudry.proto;

import "common.proto";

message ClientToServer{
    oneof payload{
        JoinGame join_game = 1;
        SendInput send_input = 2;
        Disconnect disconnect = 3;
        CallMeeting call_meeting = 4;
        SubmitVote submit_vote = 5;
        KillPlayer kill_player = 6;
    }
}